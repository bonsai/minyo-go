name: Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "scripts/**"
      - "public/**"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare.yml"
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "scripts/**"
      - "public/**"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
