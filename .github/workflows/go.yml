name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Resolve modules
        run: go mod tidy
      - name: Build browser WebAssembly bundle
        run: sh scripts/build-wasm.sh
      - name: Verify static-hosting bundle
        run: |
          test -s public/wasm/minyo-go.wasm
          test -s public/wasm/wasm_exec.js
          test -s public/wasm/wasm-loader.js
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Setup Node.js for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and browser
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
      - name: Prepare isolated E2E database
        run: |
          rm -f /tmp/minyo-go-e2e.db
          go run ./cmd/server -db /tmp/minyo-go-e2e.db -import-spots spots-verified.json
          go run ./cmd/server -db /tmp/minyo-go-e2e.db -import-quizzes quizzes.json
      - name: Run real-browser E2E
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: minyo-go-wasm
          path: public/wasm/
          if-no-files-found: error
