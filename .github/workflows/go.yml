name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Resolve modules
        run: go mod tidy
      - name: Build browser WebAssembly bundle
        run: sh scripts/build-wasm.sh
      - name: Verify static-hosting bundle
        run: |
          test -s public/wasm/minyo-go.wasm
          test -s public/wasm/wasm_exec.js
          test -s public/wasm/wasm-loader.js
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Upload browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: minyo-go-wasm
          path: public/wasm/
          if-no-files-found: error
